<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronóstico de consumo eléctrico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --fondo: #EEF2F5;
    --panel: #FFFFFF;
    --tinta: #10202C;
    --suave: #566672;
    --linea: #D5DDE3;
    --pred: #0A7EA4;
    --pred-rgb: 10, 126, 164;
    --voltio: #F2B33D;
    --error-fondo: #FDECEA;
    --error-texto: #8E1B1B;
    --aviso: #8A5A00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fondo);
    color: var(--tinta);
    font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  .contenedor { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }

  header { margin-bottom: 20px; }
  h1 {
    font-family: "Familjen Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }
  header p { margin: 0; color: var(--suave); }

  /* Error */
  #error {
    display: none;
    background: var(--error-fondo);
    color: var(--error-texto);
    border-left: 4px solid var(--error-texto);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  #error.visible { display: block; }
  #error strong { display: block; margin-bottom: 2px; }

  /* Indicador destacado */
  .hero {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    background: var(--tinta);
    color: #fff;
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .hero-principal { padding: 28px 28px 26px; }
  .hero-principal .etiqueta { color: #A9BAC6; font-size: 0.95rem; }
  .hero-principal .numero {
    font-family: "Familjen Grotesk", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(3rem, 9vw, 5.2rem);
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--voltio);
    margin: 10px 0 8px;
  }
  .hero-principal .numero small { font-size: 0.35em; font-weight: 500; color: #A9BAC6; margin-left: 8px; letter-spacing: 0; }
  .hero-principal .rango { color: #D6E0E7; font-size: 0.95rem; }

  .hero-lateral { padding: 22px 26px; border-left: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; justify-content: center; gap: 16px; }
  .dato dt { color: #A9BAC6; font-size: 0.85rem; }
  .dato dd { margin: 2px 0 0; font-size: 1.15rem; font-weight: 600; }
  .dato dd span { display: block; font-size: 0.85rem; font-weight: 400; color: #A9BAC6; }
  .dato.alerta dd span { color: var(--voltio); }
  dl { margin: 0; }

  /* Panel de la gráfica */
  .panel {
    background: var(--panel);
    border: 1px solid var(--linea);
    border-radius: 14px;
    padding: 20px;
    transition: opacity 0.2s;
  }
  .panel[aria-busy="true"] { opacity: 0.55; }

  .controles { display: flex; flex-wrap: wrap; gap: 18px 24px; align-items: end; margin-bottom: 18px; }
  .control { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; color: var(--suave); }
  .control output { color: var(--tinta); font-weight: 600; }
  select, input[type=range], button { font: inherit; }
  select {
    padding: 8px 10px;
    border: 1px solid var(--linea);
    border-radius: 8px;
    background: #fff;
    color: var(--tinta);
  }
  input[type=range] { width: 200px; accent-color: var(--pred); }
  button {
    padding: 9px 18px;
    border: 0;
    border-radius: 8px;
    background: var(--tinta);
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1d3446; }
  :focus-visible { outline: 3px solid var(--pred); outline-offset: 2px; }

  .grafica { position: relative; height: 380px; }
  .vacio { text-align: center; color: var(--suave); padding: 80px 0; display: none; }

  footer { margin-top: 14px; color: var(--suave); font-size: 0.85rem; }

  @media (max-width: 760px) {
    .hero { grid-template-columns: 1fr; }
    .hero-lateral { border-left: 0; border-top: 1px solid rgba(255,255,255,0.12); }
    .grafica { height: 320px; }
    input[type=range] { width: 100%; }
    .control { width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { .panel { transition: none; } }
</style>
</head>
<body>
<div class="contenedor">

  <header>
    <h1>Pronóstico de consumo eléctrico</h1>
    <p>Próximas horas según el modelo SARIMA, en hora de Colombia.</p>
  </header>

  <div id="error" role="alert"></div>

  <section class="hero" aria-label="Indicadores principales">
    <div class="hero-principal">
      <div class="etiqueta" id="kpi-etiqueta">Próxima hora</div>
      <div class="numero"><span id="kpi-valor">–</span><small id="kpi-unidad"></small></div>
      <div class="rango" id="kpi-rango">Esperando datos…</div>
    </div>
    <dl class="hero-lateral">
      <div class="dato">
        <dt>Máximo esperado</dt>
        <dd><span id="kpi-max-valor" style="display:inline;font-size:inherit;color:inherit;font-weight:inherit">–</span>
          <span id="kpi-max-hora">&nbsp;</span></dd>
      </div>
      <div class="dato">
        <dt>Último dato recibido</dt>
        <dd id="kpi-ultimo">–</dd>
      </div>
      <div class="dato" id="kpi-calidad-caja">
        <dt>Horas sin dato rellenadas</dt>
        <dd><span id="kpi-rellenadas" style="display:inline;font-size:inherit;color:inherit;font-weight:inherit">–</span>
          <span id="kpi-calidad">&nbsp;</span></dd>
      </div>
    </dl>
  </section>

  <section class="panel" id="panel" aria-busy="false">
    <div class="controles">
      <label class="control">
        <span>Horas a pronosticar: <output id="horas-salida">12</output></span>
        <input type="range" id="horas" min="1" max="48" value="12">
      </label>
      <label class="control">
        <span>Histórico mostrado</span>
        <select id="historia">
          <option value="24">Últimas 24 horas</option>
          <option value="48" selected>Últimas 48 horas</option>
          <option value="72">Últimas 72 horas</option>
          <option value="168">Última semana</option>
        </select>
      </label>
      <label class="control">
        <span>Confianza del intervalo</span>
        <select id="confianza">
          <option value="0.8">80 %</option>
          <option value="0.9">90 %</option>
          <option value="0.95" selected>95 %</option>
          <option value="0.99">99 %</option>
        </select>
      </label>
      <button type="button" id="actualizar">Actualizar</button>
    </div>

    <div class="grafica"><canvas id="grafica" aria-label="Gráfica del histórico, el pronóstico y su intervalo de confianza" role="img"></canvas></div>
    <div class="vacio" id="vacio">No hay datos para mostrar todavía.</div>
  </section>

  <footer id="pie"></footer>
</div>

<script>
  // ====== Ajusta estos dos valores a tu serie ======
  const VARIABLE = "Consumo eléctrico";
  const UNIDAD = "";            // por ejemplo "kWh" o "W"; déjalo vacío si no aplica
  // =================================================

  const ZONA = "America/Bogota";
  const fmtCorto = new Intl.DateTimeFormat("es-CO", { timeZone: ZONA, day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", hour12: false });
  const fmtLargo = new Intl.DateTimeFormat("es-CO", { timeZone: ZONA, weekday: "short", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit", hour12: false });
  const fmtHora  = new Intl.DateTimeFormat("es-CO", { timeZone: ZONA, hour: "2-digit", minute: "2-digit", hour12: false });
  const fmtNum   = (n) => Number(n).toLocaleString("es-CO", { maximumFractionDigits: 1 });
  const conUnidad = (n) => fmtNum(n) + (UNIDAD ? " " + UNIDAD : "");

  const $ = (id) => document.getElementById(id);
  let grafica = null;

  // ---------- Error ----------
  function mostrarError(titulo, detalle) {
    $("error").innerHTML = "<strong></strong><span></span>";
    $("error").querySelector("strong").textContent = titulo;
    $("error").querySelector("span").textContent = detalle;
    $("error").classList.add("visible");
  }
  function ocultarError() { $("error").classList.remove("visible"); }

  function textoDetalle(datos, estado) {
    const d = datos && datos.detail;
    if (typeof d === "string") return d;
    if (Array.isArray(d)) return d.map((e) => e.msg || JSON.stringify(e)).join(". ");
    return "La API respondió con el código " + estado + ".";
  }

  // ---------- Carga ----------
  async function cargar() {
    const params = new URLSearchParams({
      horas: $("horas").value,
      historia: $("historia").value,
      confianza: $("confianza").value,
    });
    $("panel").setAttribute("aria-busy", "true");
    ocultarError();
    try {
      const resp = await fetch("/api/prediccion?" + params.toString());
      let datos = null;
      try { datos = await resp.json(); } catch (_) { /* respuesta sin JSON */ }
      if (!resp.ok) {
        mostrarError("No se pudo obtener el pronóstico", textoDetalle(datos, resp.status));
        return;
      }
      pintar(datos);
    } catch (e) {
      mostrarError("No se pudo conectar con la API", "Revisa que el servidor esté en ejecución y vuelve a intentarlo.");
    } finally {
      $("panel").setAttribute("aria-busy", "false");
    }
  }

  // ---------- Pintar ----------
  function pintar(d) {
    const hist = d.historico || [];
    const pred = d.prediccion || [];
    const pct = Math.round(d.confianza * 100) + " %";

    if (!pred.length) {
      mostrarError("La API no devolvió pronóstico", "Prueba con otro número de horas.");
      return;
    }

    // Indicador destacado: valor de la próxima hora
    const p0 = pred[0];
    $("kpi-etiqueta").textContent = VARIABLE + " previsto para las " + fmtHora.format(new Date(p0.tiempo));
    $("kpi-valor").textContent = fmtNum(p0.prediccion);
    $("kpi-unidad").textContent = UNIDAD;
    $("kpi-rango").textContent = "Entre " + conUnidad(p0.limite_inferior) + " y " + conUnidad(p0.limite_superior) + " con " + pct + " de confianza";

    // Máximo esperado
    const pMax = pred.reduce((a, b) => (b.prediccion > a.prediccion ? b : a));
    $("kpi-max-valor").textContent = conUnidad(pMax.prediccion);
    $("kpi-max-hora").textContent = "a las " + fmtHora.format(new Date(pMax.tiempo));

    // Último dato y calidad
    $("kpi-ultimo").textContent = fmtLargo.format(new Date(d.ultima_observacion));
    const rell = d.horas_rellenadas || 0;
    const ctx = d.horas_contexto_usadas || 0;
    $("kpi-rellenadas").textContent = rell + " de " + ctx;
    const caja = $("kpi-calidad-caja");
    if (rell === 0) {
      $("kpi-calidad").textContent = "Datos completos";
      caja.classList.remove("alerta");
    } else if (ctx && rell / ctx > 0.1) {
      $("kpi-calidad").textContent = "El sensor tuvo huecos: el pronóstico es menos confiable";
      caja.classList.add("alerta");
    } else {
      $("kpi-calidad").textContent = "Pocos huecos";
      caja.classList.remove("alerta");
    }

    // Series de la gráfica
    const n = hist.length, m = pred.length;
    const etiquetas = hist.map((h) => fmtCorto.format(new Date(h.tiempo)))
      .concat(pred.map((p) => fmtCorto.format(new Date(p.tiempo))));
    const etiquetasLargas = hist.map((h) => fmtLargo.format(new Date(h.tiempo)))
      .concat(pred.map((p) => fmtLargo.format(new Date(p.tiempo))));
    const huecos = (k) => Array(Math.max(k, 0)).fill(null);

    const ultimo = n ? hist[n - 1].valor : null;           // une el histórico con el pronóstico
    const serieHist = hist.map((h) => h.valor).concat(huecos(m));
    const seriePred = huecos(n - 1).concat([ultimo], pred.map((p) => p.prediccion));
    const serieInf  = huecos(n - 1).concat([ultimo], pred.map((p) => p.limite_inferior));
    const serieSup  = huecos(n - 1).concat([ultimo], pred.map((p) => p.limite_superior));

    if (grafica) grafica.destroy();
    grafica = new Chart($("grafica"), {
      type: "line",
      data: {
        labels: etiquetas,
        datasets: [
          { label: "Límite inferior", data: serieInf, borderColor: "rgba(10, 126, 164, 0.35)", borderWidth: 1, pointRadius: 0, fill: false },
          { label: "Límite superior", data: serieSup, borderColor: "rgba(10, 126, 164, 0.35)", backgroundColor: "rgba(10, 126, 164, 0.16)", borderWidth: 1, pointRadius: 0, fill: "-1" },
          { label: "Histórico", data: serieHist, borderColor: "#10202C", backgroundColor: "#10202C", borderWidth: 2, pointRadius: 0, tension: 0.2 },
          { label: "Pronóstico", data: seriePred, borderColor: "#0A7EA4", backgroundColor: "#0A7EA4", borderWidth: 2.5, borderDash: [6, 4], pointRadius: 3, tension: 0.2 },
        ],
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            position: "bottom",
            labels: {
              usePointStyle: true,
              generateLabels(chart) {
                const base = Chart.defaults.plugins.legend.labels.generateLabels(chart);
                return base
                  .filter((l) => l.datasetIndex !== 0)
                  .map((l) => (l.datasetIndex === 1 ? { ...l, text: "Intervalo de confianza " + pct } : l));
              },
            },
          },
          tooltip: {
            filter: (item) => item.raw !== null && item.raw !== undefined,
            callbacks: {
              title: (items) => etiquetasLargas[items[0].dataIndex],
              label: (item) => item.dataset.label + ": " + conUnidad(item.raw),
            },
          },
        },
        scales: {
          x: { ticks: { autoSkip: true, maxTicksLimit: 9, maxRotation: 0 }, grid: { display: false } },
          y: { title: { display: !!UNIDAD, text: UNIDAD }, grid: { color: "#E4EAEE" } },
        },
      },
    });

    $("pie").textContent = "Modelo: SARIMA. Intervalo de confianza del " + pct + ". Todas las horas están en hora de Colombia (UTC−5).";
  }

  // ---------- Eventos ----------
  $("horas").addEventListener("input", () => { $("horas-salida").textContent = $("horas").value; });
  $("horas").addEventListener("change", cargar);
  $("historia").addEventListener("change", cargar);
  $("confianza").addEventListener("change", cargar);
  $("actualizar").addEventListener("click", cargar);

  cargar();
</script>
</body>
</html>
